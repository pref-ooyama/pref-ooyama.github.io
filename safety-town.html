<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地域の安全マップ - 大山県</title>
    <link rel="icon" href="oyama.webp" type="image/webp">
    <style>
        :root {
            --main-color: #232337; 
            --bg-light: #f0f2f5;
            --text-color: #333;
            --white: #ffffff;
            --border-color: #ddd;
            --accent-blue: #0033cc;
            --map-green: #2ecc71;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- ヘッダー（スマホ対応） --- */
        header {
            background: var(--main-color);
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-container {
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
        }
        .logo-area img { height: 35px; }
        .logo-area h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .nav-toggle {
            display: none;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }
        .nav-toggle span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--white);
            margin: 6px 0;
        }

        .main-nav { display: flex; list-style: none; margin: 0; padding: 0; gap: 5px; }
        .nav-item { padding: 10px 15px; color: var(--white); text-decoration: none; font-size: 14px; font-weight: bold; border-radius: 4px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }

        @media (max-width: 1024px) {
            .nav-toggle { display: block; }
            .main-nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 75%;
                height: 100vh;
                background: var(--main-color);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: 0.4s;
                gap: 20px;
            }
            .main-nav.active { right: 0; }
            .nav-item { font-size: 18px; width: 80%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
        }

        /* --- メインコンテンツ --- */
        .content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 15px;
            text-align: center;
        }

        .page-title {
            font-size: 24px;
            color: var(--main-color);
            border-bottom: 3px solid var(--main-color);
            padding-bottom: 10px;
            margin-bottom: 40px;
        }

        /* 準備中表示用ボックス */
        .maintenance-card {
            background: var(--white);
            padding: 60px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 8px solid var(--map-green);
        }

        .maintenance-card h2 {
            font-size: 28px;
            color: var(--map-green);
            margin-bottom: 15px;
        }

        .maintenance-card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--map-green);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 0 auto 30px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-back {
            display: inline-block;
            background-color: var(--main-color);
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: opacity 0.3s;
        }
        .btn-back:hover { opacity: 0.8; }

        /* --- フッター --- */
        footer {
            background: #f8f9fa;
            padding: 40px 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
        .footer-copy { font-weight: bold; color: var(--main-color); margin-bottom: 10px; }
        .roblox-disclaimer { font-size: 12px; color: #777; line-height: 1.5; }

    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="logo-area">
            <img src="oyama.webp" alt="大山県章">
            <h1>大山県</h1>
        </a>
        <button class="nav-toggle" id="nav-toggle">
            <span></span><span></span><span></span>
        </button>
        <nav class="main-nav" id="main-nav">
            <a href="life.html" class="nav-item">くらし・手続き</a>
            <a href="education.html" class="nav-item">子育て・教育</a>
            <a href="welfare.html" class="nav-item">健康・福祉</a>
            <a href="kanko.html" class="nav-item">観光・魅力</a>
            <a href="business.html" class="nav-item">ビジネス・産業</a>
            <a href="fire.html" class="nav-item">防災情報</a>
            <a href="recruit.html" class="nav-item">採用案内</a>
        </nav>
    </div>
</header>

<main class="content">
    <h1 class="page-title">地域の安全マップ</h1>

    <div class="maintenance-card">
        <div class="loader"></div>
        <h2>ただいま準備中です</h2>
        <p>
            大山県内の犯罪発生状況や、不審者情報、防犯灯の設置場所などを<br>
            リアルタイムで確認できる「地域の安全マップ」は現在システムの構築中です。<br>
            公開まで今しばらくお待ちください。
        </p>
        <a href="crime-prevention.html" class="btn-back">防犯情報トップに戻る</a>
    </div>
</main>

<footer>
    <div class="footer-copy">&copy; <span id="footer-year"></span> 大山県 Oyama Prefecture</div>
    <div class="roblox-disclaimer">
        ※本サイトは大山県（架空）の広報を目的とした、Roblox（ロブロックス）上の体験に関するウェブサイトです。<br>
        実在の地理情報システム等とは一切関係ありません。
    </div>
</footer>

<script>
    const navToggle = document.getElementById('nav-toggle');
    const mainNav = document.getElementById('main-nav');
    navToggle.addEventListener('click', () => {
        mainNav.classList.toggle('active');
    });

    document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
