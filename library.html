<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用案内 - 大山県立図書館</title>
    <link rel="icon" href="oyama.webp" type="image/webp">
    <style>
        :root {
            --main-color: #232337; 
            --bg-light: #ffffff;
            --text-color: #333;
            --accent-green: #27ae60;
            --border-color: #eee;
        }

        body { font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif; margin: 0; background-color: var(--bg-light); color: var(--text-color); }

        /* --- ヘッダー（共通） --- */
        header { background: var(--main-color); color: white; position: sticky; top: 0; z-index: 1000; }
        .header-container { width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .logo-area { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; z-index: 1100; }
        .logo-area img { height: 35px; }
        .logo-area h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .nav-toggle { display: none; cursor: pointer; background: none; border: none; padding: 10px; z-index: 1100; }
        .nav-toggle span { display: block; width: 25px; height: 2px; background: white; margin: 6px 0; transition: 0.3s; }
        .main-nav { display: flex; list-style: none; margin: 0; padding: 0; gap: 5px; }
        .nav-item { padding: 10px 15px; color: white; text-decoration: none; font-size: 14px; font-weight: bold; border-radius: 4px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); }

        @media (max-width: 1024px) {
            .nav-toggle { display: block; }
            .main-nav { position: fixed; top: 0; right: -100%; width: 70%; height: 100vh; background: var(--main-color); flex-direction: column; justify-content: center; align-items: center; transition: 0.4s; gap: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.3); }
            .main-nav.active { right: 0; }
            .nav-item { font-size: 18px; width: 80%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
            .nav-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .nav-toggle.open span:nth-child(2) { opacity: 0; }
            .nav-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        }

        /* --- コンテンツ --- */
        .content { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .page-header { margin-bottom: 40px; border-bottom: 2px solid var(--accent-green); display: inline-block; }
        .page-header h2 { margin: 0 0 10px 0; color: var(--main-color); }
        .info-card { background: #f9f9f9; padding: 25px; border-radius: 8px; margin-bottom: 30px; }
        .info-card h3 { color: var(--accent-green); margin-top: 0; }
        .time-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .time-table th, .time-table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        footer { text-align: center; padding: 60px 0 40px; color: #ccc; font-size: 12px; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="logo-area">
            <img src="oyama.webp" alt="大山県章">
            <h1>大山県</h1>
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く"><span></span><span></span><span></span></button>
        <nav class="main-nav" id="main-nav">
            <a href="life.html" class="nav-item">くらし</a>
            <a href="education.html" class="nav-item">教育</a>
            <a href="welfare.html" class="nav-item">健康・福祉</a>
            <a href="business.html" class="nav-item">ビジネス</a>
        </nav>
    </div>
</header>

<main class="content">
    <div class="page-header">
        <h2>大山県立図書館 利用案内</h2>
    </div>

    <div class="info-card">
        <h3>開館時間</h3>
        <table class="time-table">
            <tr><th>火曜日〜金曜日</th><td>午前9時 〜 午後7時</td></tr>
            <tr><th>土・日・祝日</th><td>午前9時 〜 午後5時</td></tr>
        </table>
        <p><small>※月曜日は休館日です（祝日の場合は翌日が休館となります）。</small></p>
    </div>

    <div class="info-card">
        <h3>貸出について</h3>
        <ul>
            <li>本・雑誌：1人10冊まで、2週間</li>
            <li>視聴覚資料：1人2点まで、1週間</li>
            <li>貸出には「大山図書カード」が必要です。</li>
        </ul>
    </div>

    <div class="info-card">
        <h3>来館時のお願い</h3>
        <p>館内での携帯電話の使用はマナーモードに設定し、通話はロビーでお願いします。また、館内での飲食は指定の休憩スペースをご利用ください。</p>
    </div>
</main>

<footer>&copy; 大山県 Oyama Prefecture</footer>

<script>
    const navToggle = document.getElementById('nav-toggle');
    const mainNav = document.getElementById('main-nav');
    navToggle.addEventListener('click', () => {
        navToggle.classList.toggle('open');
        mainNav.classList.toggle('active');
    });
</script>
</body>
</html>
