<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>くらし・手続き - 大山県</title>
    <style>
        :root {
            --main-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3436;
        }

        body { font-family: "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; }

        /* ヘッダー */
        header { background: var(--main-color); color: white; padding: 20px; text-align: center; }
        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }

        /* コンテンツ */
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .page-title { text-align: center; margin-bottom: 40px; color: var(--main-color); }

        .category-card { 
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 5px solid var(--accent-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .category-card h2 { margin: 0 0 15px 0; font-size: 20px; color: var(--main-color); }

        .link-list { list-style: none; padding: 0; margin: 0; }
        .link-list li { margin: 10px 0; }
        .link-list a {
            display: block;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s;
            border: 1px solid #edf2f7;
        }
        .link-list a:hover {
            background: var(--accent-color);
            color: white;
            transform: translateX(5px);
        }

        footer { text-align: center; padding: 30px; font-size: 12px; color: #95a5a6; }
    </style>
</head>
<body>

<header>
    <div class="logo">大山県ポータル</div>
</header>

<div class="container">
    <h1 class="page-title">くらし・手続き</h1>

    <div class="category-card">
        <h2>住民登録・身分証明</h2>
        <ul class="link-list">
            <li><a href="oyamapass.html">おおやまパスの新規発行</a></li>
            <li><a href="badge.html">名誉県民バッジの申請</a></li>
        </ul>
    </div>

    <div class="category-card">
        <h2>税金・通貨</h2>
        <ul class="link-list">
            <li><a href="tax.html">県民税の支払いについて</a></li>
            <li><a href="currency.html">独自通貨「OYAMA」の管理</a></li>
            <li><a href="donation.html">大山振興募金への協力</a></li>
        </ul>
    </div>

    <div class="category-card">
        <h2>住まい・環境</h2>
        <ul class="link-list">
            <li><a href="housing.html">県営住宅の入居申し込み</a></li>
            <li><a href="trash.html">ゴミ分別ガイド</a></li>
            <li><a href="land.html">土地所有権の電子登録</a></li>
        </ul>
    </div>
</div>

<footer>
    &copy; 2026 大山県 Oyama Prefecture
</footer>

</body>
</html>
