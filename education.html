<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子育て・教育 - 大山県</title>
    <link rel="icon" href="oyama.webp" type="image/webp">
    <style>
        :root {
            --main-color: #232337; 
            --bg-light: #f4f7f4;
            --text-color: #333;
            --white: #ffffff;
            --accent-green: #2e7d32;
            --border-color: #e0e0e0;
        }

        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Sans", Meiryo, sans-serif;
            margin: 0;
            background-color: var(--bg-light);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* --- ヘッダー・ナビゲーション --- */
        header {
            background: var(--main-color);
            color: var(--white);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--white);
            z-index: 1100;
        }
        
        .logo-area img { height: 35px; }
        .logo-area h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }

        .nav-toggle {
            display: none;
            cursor: pointer;
            z-index: 1100;
            background: none;
            border: none;
            padding: 10px;
        }

        .nav-toggle span {
            display: block;
            width: 25px;
            height: 2px;
            background: var(--white);
            margin: 6px 0;
            transition: 0.3s;
        }

        .main-nav { display: flex; list-style: none; margin: 0; padding: 0; gap: 5px; }
        .nav-item {
            padding: 10px 15px;
            color: var(--white);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); }

        @media (max-width: 1024px) {
            .nav-toggle { display: block; }
            .main-nav {
                position: fixed; top: 0; right: -100%; width: 70%; height: 100vh;
                background: var(--main-color); flex-direction: column;
                justify-content: center; align-items: center;
                transition: 0.4s; gap: 20px; box-shadow: -5px 0 15px rgba(0,0,0,0.3);
            }
            .main-nav.active { right: 0; }
            .nav-item { font-size: 18px; width: 80%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
            .nav-toggle.open span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
            .nav-toggle.open span:nth-child(2) { opacity: 0; }
            .nav-toggle.open span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
        }

        /* --- コンテンツ構造 --- */
        .container { max-width: 1100px; margin: 40px auto; display: flex; gap: 30px; padding: 0 20px; }
        .side-menu { flex: 0 0 260px; height: fit-content; position: sticky; top: 100px; }
        .side-card { background: var(--white); border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-top: 4px solid var(--accent-green); }
        .side-card h2 { font-size: 18px; margin-top: 0; color: var(--accent-green); display: flex; align-items: center; gap: 8px; }
        .side-nav-list { list-style: none; padding: 0; margin: 0; }
        .side-nav-list li a { display: block; padding: 12px 10px; text-decoration: none; color: #555; border-bottom: 1px solid #eee; transition: 0.2s; }
        .side-nav-list li a:hover { background: #f0f9f0; color: var(--accent-green); padding-left: 15px; }

        .main-content { flex: 1; }
        .edu-section { background: var(--white); border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
        .section-header { background: var(--accent-green); color: white; padding: 15px 25px; }
        .section-header h3 { margin: 0; font-size: 1.2rem; }
        .grid-links { display: grid; grid-template-columns: repeat(2, 1fr); padding: 20px; gap: 15px; }
        .grid-links a { display: flex; align-items: center; padding: 15px; background: #f9f9f9; border: 1px solid #eee; border-radius: 6px; text-decoration: none; color: var(--text-color); font-weight: 500; transition: 0.2s; }
        .grid-links a:hover { border-color: var(--accent-green); background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transform: translateY(-2px); }

        @media (max-width: 850px) {
            .container { flex-direction: column; }
            .side-menu { flex: none; width: 100%; position: static; }
            .grid-links { grid-template-columns: 1fr; }
        }

        footer { text-align: center; padding: 40px 0; color: #777; font-size: 13px; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="logo-area">
            <img src="oyama.webp" alt="大山県章">
            <h1>大山県</h1>
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="main-nav" id="main-nav">
            <a href="life.html" class="nav-item">くらし・手続き</a>
            <a href="education.html" class="nav-item">子育て・教育</a>
            <a href="welfare.html" class="nav-item">健康・福祉</a>
            <a href="kanko.html" class="nav-item">観光・魅力</a>
            <a href="business.html" class="nav-item">ビジネス・産業</a>
            <a href="fire.html" class="nav-item">防災情報</a>
            <a href="recruit.html" class="nav-item">採用案内</a>
        </nav>
    </div>
</header>

<div class="container">
    <aside class="side-menu">
        <div class="side-card">
            <h2>メニュー</h2>
            <ul class="side-nav-list">
                <li><a href="#kosodate">子育て支援</a></li>
                <li><a href="#school">学校・教育</a></li>
                <li><a href="#lifelong">生涯学習・文化</a></li>
                <li><a href="#youth">青少年健全育成</a></li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <section id="kosodate" class="edu-section">
            <div class="section-header"><h3>子育て支援</h3></div>
            <div class="grid-links">
                <a href="jidou-teate.html">児童手当・各種助成</a>
                <a href="hoiku-check.html">保育園の空き状況</a>
                <a href="sick-care.html">病児・病後児保育</a>
                <a href="mother-child.html">母子保健・健診</a>
            </div>
        </section>

        <section id="school" class="edu-section">
            <div class="section-header"><h3>学校・教育</h3></div>
            <div class="grid-links">
                <a href="admission.html">小・中学校への入学</a>
                <a href="exam-info.html">県立高校入試情報</a>
                <a href="school-lunch.html">学校給食について</a>
                <a href="scholarship.html">奨学金・就学援助</a>
            </div>
        </section>

        <section id="lifelong" class="edu-section">
            <div class="section-header"><h3>生涯学習・文化</h3></div>
            <div class="grid-links">
                <a href="library.html">県立図書館の利用</a>
                <a href="museum.html">博物館・美術館</a>
                <a href="sports.html">スポーツ施設の予約</a>
                <a href="lecture.html">市民公開講座</a>
            </div>
        </section>
    </main>
</div>

<footer>
    &copy; 大山県 Oyama Prefecture
</footer>

<script>
    const navToggle = document.getElementById('nav-toggle');
    const mainNav = document.getElementById('main-nav');
    navToggle.addEventListener('click', () => {
        navToggle.classList.toggle('open');
        mainNav.classList.toggle('active');
    });
</script>
</body>
</html>
